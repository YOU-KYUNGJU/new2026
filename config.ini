[PATHS]
; Poppler bin 경로 (필수)
POPPLER_PATH = C:\poppler\Library\bin
; Tesseract 실행 파일 경로 (필수)
TESSERACT_EXE = C:\Program Files\Tesseract-OCR\tesseract.exe

[OCR]
; DPI 설정 (기본 500) - 높을수록 인식률 좋으나 속도 느림/메모리 많이 씀
DPI = 500
; 페이지 처리 배치 크기 (메모리 절약용)
BATCH_SIZE = 10

[WATCHER]
; 폴더 스캔 주기 (초)
SCAN_INTERVAL_SEC = 1.0
; 파일 안정화 확인 간격 (초)
STABLE_CHECK_SEC = 0.7
; 파일 안정화 재시도 횟수
STABLE_RETRY = 3

[SERVER]
; 기본 서버 경로
BASE_ROOT_PH = \\192.168.1.7\유해물질시험팀\3. 폼알데히드,pH파트\pH\RDMS\H111분석일지 SCAN
BASE_ROOT_FORMALDEHYDE = \\192.168.1.7\유해물질시험팀\3. 폼알데히드,pH파트\FORMALDEHYDE\RDMS\완료
; 대체 서버 경로 (IP 접속 불가시)
ALT_SERVER_NAME = \\fiti_fileserver
